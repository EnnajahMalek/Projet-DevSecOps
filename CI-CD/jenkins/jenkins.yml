jenkins:                            

  systemMessage: 'Version 2 , contient  '
 
  numExecutors: 2
 
  securityRealm:                   
    local:                          
      allowsSignup: false          
      users:                       
        - id: admin               
          password: ${JENKINS_ADMIN_PASSWORD}
         
  authorizationStrategy:           
    loggedInUsersCanDoAnything:     
      allowAnonymousRead: false     


credentials:                        
  system:                          
    domainCredentials:              
      - credentials:               
          - usernamePassword:       
              scope: GLOBAL        
              id: github-pat        
              username: ${GITHUB_USER}    
              password: ${GITHUB_PAT}     
unclassified:                       
  globalLibraries:                  
    libraries:
      - name: devsecops-jenkins-biblio-library       
        defaultVersion: main        
        retriever:                  
          modernSCM:
            scm:
              github:               
                repoOwner: ${GITHUB_USER}            
                repository: ${REPOSITORY}
                credentialsId: github-pat     


jobs:                              
  - script: >                       
      multibranchPipelineJob('${REPOSITORY}') {   
        branchSources {                                
          github {                                      
            id('platform')                              
            scanCredentialsId('github-pat')            
            repoOwner('${GITHUB_USER}')                         
            repository('${REPOSITORY}')            
          }
        }
      }
      factory {
          workflowBranchProjectFactory {
              scriptPath('CI-CD/JenkinsFile')
          }
      }