jenkins:                            

  systemMessage: 'Version 2 , contient  '
 
  numExecutors: 2
 
  securityRealm:                   
    local:                          
      allowsSignup: false          
      users:                       
        - id: admin               
          password: ${JENKINS_ADMIN_PASSWORD}
         
  authorizationStrategy:           
    loggedInUsersCanDoAnything:     
      allowAnonymousRead: false     


credentials:                        
  system:                          
    domainCredentials:              
      - credentials:               
          - usernamePassword:       
              scope: GLOBAL        
              id: github-pat        
              username: ${GITHUB_USER}    
              password: ${GITHUB_PAT}     
unclassified:                       
  globalLibraries:                  
    libraries:
      - name: devsecops-lib        # the name used in the Jenkinsfile: @Library('devsecops-lib')
        defaultVersion: main        
        retriever:                  
          modernSCM:
            scm:
              github:               
                repoOwner: ${GITHUB_USER}            
                repository: devsecops-platform
                credentialsId: github-pat     


jobs:                              
  - script: >                       
      multibranchPipelineJob('devsecops-platform') {   
        branchSources {                                
          github {                                      
            id('platform')                              
            scanCredentialsId('github-pat')            
            repoOwner('<you>')                         
            repository('devsecops-platform')            
          }
        }
      }