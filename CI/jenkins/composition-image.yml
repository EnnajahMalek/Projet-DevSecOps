services:
  docker:
    image: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    networks:
      jenkins:
        aliases: [docker]

  jenkins:
    build: .
    ports:
      - '127.0.0.1:8080:8080'
    env_file: .env
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/casc
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: '1'
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
    networks: [jenkins]

volumes:
  jenkins-data:
  jenkins-docker-certs:

networks:
  jenkins: