apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: notes
  labels:
    app.kubernetes.io/name: app
spec:
  ingressClassName: traefik
  rules:
    - host: app.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80