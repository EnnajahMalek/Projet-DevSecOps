apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EnnajahMalek/Projet-DevSecOps.git
    targetRevision: HEAD
    path: k8s/base
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: notes
  syncPolicy:
    syncOptions:
      - CreateNamespace=false