apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connection-postgres-app
  namespace: notes
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: app
      ports:
        - protocol: TCP
          port: 5432