apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: limite-resources-pods
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: notes }
    resourceRules:
      - { apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE","UPDATE"], resources: ["pods"] }
  validations:
    - expression: >-
        object.spec.containers.all(c, has(c.resources) && has(c.resources.requests)
          && 'cpu' in c.resources.requests && 'memory' in c.resources.requests
          && has(c.resources.limits)
          && 'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: "Il faut requests et limits CPU/mémoire sur chaque conteneur."
