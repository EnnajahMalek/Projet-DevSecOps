<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Taking App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="max-w-md mx-auto">
    <h1 class="text-center mb-4">Notes</h1>

    <div class="card mb-3">
      <div class="card-body">
        <form id="noteForm">
          <div class="mb-2">
            <label>Title</label>
            <input type="text" id="noteTitle" class="form-control" required>
          </div>
          <div class="mb-2">
            <label>Content</label>
            <textarea id="noteContent" class="form-control" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">Save Note</button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Your Notes</h5>
        <ul id="notesList" class="list-group mb-3">
        </ul>
        <button id="refreshBtn" class="btn btn-sm btn-outline-secondary">Refresh</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('noteForm');
    const titleInput = document.getElementById('noteTitle');
    const contentInput = document.getElementById('noteContent');
    const notesList = document.getElementById('notesList');
    const refreshBtn = document.getElementById('refreshBtn');

    async function loadNotes() {
      const res = await fetch('/notes');
      const notes = await res.json();
      notesList.innerHTML = '';
      notes.forEach(n => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-start';
        li.innerHTML = `
          <div class="w-100">
            <h6 class="mb-1">${escapeHtml(n.title)}</h6>
            <p class="mb-0 small text-muted">${escapeHtml(n.content.substring(0, 50))}...</p>
          </div>
          <div>
            <button class="btn btn-sm btn-outline-primary me-1 edit-btn" data-id="${n.id}">Edit</button>
            <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${n.id}">Del</button>
          </div>
        `;
        notesList.appendChild(li);
      });
      attachListeners();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function attachListeners() {
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const note = notes.find(n => n.id === parseInt(id));
          if (!confirm(`Edit note "${note.title}"?`)) return;
          const newTitle = prompt('New title:', note.title);
          const newContent = prompt('New content:', note.content);
          if (newTitle !== null && newContent !== null) {
            updateNote(id, newTitle, newContent);
          }
        });
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (confirm('Delete this note?')) {
            deleteNote(btn.dataset.id);
          }
        });
      });
    }

    async function updateNote(id, title, content) {
      await fetch(`/notes/${id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title, content }) });
      loadNotes();
    }

    async function deleteNote(id) {
      await fetch(`/notes/${id}`, { method: 'DELETE' });
      loadNotes();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/notes', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title: titleInput.value, content: contentInput.value }) });
      titleInput.value = '';
      contentInput.value = '';
      loadNotes();
    });

    refreshBtn.addEventListener('click', loadNotes);

    loadNotes();
  </script>
</body>
</html>
